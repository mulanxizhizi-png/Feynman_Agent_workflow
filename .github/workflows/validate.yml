name: Validate workflow sources
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          for file in 2026-10-08-agent-workflow/scripts/*.mjs; do node --check "$file"; done
      - name: Python syntax
        run: python -m py_compile 2026-10-08-agent-workflow/scripts/api-probe.py
      - name: Offline contract tests
        working-directory: 2026-10-08-agent-workflow
        run: npm test
