# Template: coordinator/reviewer 6.1 Sol high; executor 6 Sol low.
# Audit uses explicit independent-reviewer profile in fresh context.
# Does not switch an existing chat or override live permissions.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
[agents]
enabled = true
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "low"
max_concurrent_threads_per_session = 2
[mcp_servers.gemini_visual_review]
enabled = false
command = "node"
# Replace with an absolute local checkout path before explicitly enabling.
args = ["adapters/gemini/scripts/mcp.mjs"]
startup_timeout_sec = 20
tool_timeout_sec = 300
